name: release

# v2 rewrite: UsageMeter is now the Electron app under app/ (v1 Python has moved to legacy/ and is no
# longer built or released). NOTE: untested until the first real v* tag push after this rewrite -
# verify the produced artifact name/path against app/electron-builder.yml (artifactName:
# ${productName}-Setup-${version}.${ext}) if this run fails.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # softprops/action-gh-release needs this to create the release and upload the asset

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      # electron-builder.yml sets npmRebuild: false, so the packaged better-sqlite3 ABI depends
      # entirely on the postinstall install-app-deps having run correctly. Rebuild explicitly so a
      # silent no-op can't ship a wrong-ABI installer (CI never boots the artifact to catch it).
      - name: Rebuild native modules for Electron ABI
        run: npx @electron/rebuild -f -w better-sqlite3

      - name: Build + package (Windows NSIS installer)
        run: npm run build:win

      - name: Attach installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/dist/UsageMeter-Setup-*.exe
