name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest -q
      - name: Build exe
        run: |
          pyinstaller --onefile --noconsole --name ClaudeMeter ^
            --icon assets/icon.ico --add-data "assets;assets" ^
            src/claudemeter/__main__.py
      - name: Rename artifact
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          Rename-Item dist/ClaudeMeter.exe "ClaudeMeter-$tag-win64.exe"
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ClaudeMeter-*.exe
