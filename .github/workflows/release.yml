name: release

# v2부터 출하 대상은 app-tauri/ 의 Tauri 앱이다. app/(Electron v1)과 legacy/(Python v0.1)는
# 보존만 되어 있고 빌드·릴리스하지 않는다.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # softprops/action-gh-release가 릴리스 생성·자산 업로드에 필요

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app-tauri
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-tauri/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      # build.rs가 node_modules의 ccusage exe를 src-tauri/binaries/로 복사하므로 npm ci가 선행돼야
      # 한다. 없으면 build.rs가 panic으로 중단시킨다(조용히 빠지지 않는다).
      - name: Install dependencies
        run: npm ci

      - name: Build + package (Windows NSIS installer)
        run: npx tauri build

      - name: Attach installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app-tauri/src-tauri/target/release/bundle/nsis/UsageMeter_*_x64-setup.exe
