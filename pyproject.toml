[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claudemeter"
version = "0.1.0"
description = "Windows tray app that monitors Claude Code token usage"
requires-python = ">=3.11"
authors = [{name = "kimyori"}]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
